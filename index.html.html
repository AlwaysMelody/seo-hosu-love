<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>관계성 페어틀 제작기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#eeecf5;--panel:#fff;--ink:#241f35;--mute:#6d6784;--line:#d9d5e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131d;--panel:#1f1c2b;--ink:#ece8f7;--mute:#a29bb8;--line:#363149}}
:root[data-theme="dark"]{--bg:#15131d;--panel:#1f1c2b;--ink:#ece8f7;--mute:#a29bb8;--line:#363149}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 420px at 75% -8%,color-mix(in srgb,#8b7cf0 22%,transparent),transparent),var(--bg);color:var(--ink);font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;line-height:1.5}
.app{display:grid;grid-template-columns:minmax(280px,360px) 1fr;gap:24px;max-width:1100px;margin:0 auto;padding:20px}
@media(max-width:820px){.app{grid-template-columns:1fr}.stage{order:-1}}
.form{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(60,40,120,.08)}
.form h1{font-family:'Gowun Batang',serif;font-size:20px;margin:0 0 14px}
.form label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.form input[type=text],.form textarea{width:100%;font:inherit;font-size:15px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.form textarea{resize:vertical;min-height:56px}
.form input:focus-visible,.form textarea:focus-visible,button:focus-visible{outline:2px solid #8b7cf0;outline-offset:2px}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
input[type=color]{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:transparent;padding:2px}
.gq{border-top:1px dashed var(--line);margin-top:12px;padding-top:4px}
.gq .row span{flex:0 0 22px;font-size:12px;color:var(--mute)}
.sec{font-family:'Gowun Batang',serif;font-weight:700;margin:20px 0 0;font-size:15px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
button{font:inherit;font-size:14px;padding:10px 14px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;flex:1}
button.main{background:#6a5acd;border-color:#6a5acd;color:#fff}
.stage{display:flex;justify-content:center;align-items:flex-start}
.card{width:100%;max-width:560px;background:linear-gradient(160deg,#2a2440,#1b1829 60%,#221d34);color:#f2eefb;border-radius:26px;padding:40px 32px 34px;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(20,10,50,.35);--a:#6fa8dc;--b:#e58aa0}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 0% 0%,var(--a28),transparent 55%),radial-gradient(circle at 100% 100%,var(--b28),transparent 55%);pointer-events:none}
.card>*{position:relative}.card::after{content:"";position:absolute;inset:10px;border-radius:18px;border:1px solid rgba(255,255,255,.18);pointer-events:none}.spk{position:absolute!important;inset:0;pointer-events:none}.spk b{position:absolute;color:#fff;opacity:.75;font-size:15px;font-weight:400;animation:tw 3.2s ease-in-out infinite}@keyframes tw{50%{opacity:.15;transform:scale(.7)}}.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;font-size:11px;color:#e9e3fb}.orn i{height:1px;width:64px;background:linear-gradient(90deg,transparent,var(--a))}.orn i:last-child{background:linear-gradient(90deg,var(--b),transparent)}.orn em{font-style:normal}
.card h2{font-family:'Gowun Batang',serif;font-size:33px;line-height:1.25;letter-spacing:.03em;margin:0;text-align:center;font-weight:700;text-shadow:0 0 22px var(--ab)}
.dday{text-align:center;margin:12px 0 32px}.dday small{display:block;color:#c9c2dd;font-size:13px;letter-spacing:.04em}.dday strong{display:block;font-family:'Gowun Batang',serif;font-size:38px;line-height:1.2;letter-spacing:.05em;color:#fff;text-shadow:0 0 18px var(--a),0 0 26px var(--b)}.dday span{display:block;font-size:14px;color:#e4def5;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.pair{display:grid;grid-template-columns:136px 1fr 136px;align-items:center;gap:0}.mid{position:relative}.knot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:#1b1829;border:1.5px solid #fff;color:#fff;box-shadow:0 0 18px var(--ab)}
.who{text-align:center}
.ph{width:116px;height:116px;margin:0 auto;border-radius:50%;background:linear-gradient(135deg,var(--c),#231f33);background-size:cover;background-position:center;border:0;box-shadow:0 0 0 5px #1b1829,0 0 0 7px var(--c),0 0 32px var(--c60);display:grid;place-items:center;font-family:'Gowun Batang',serif;font-size:42px;color:#fff;overflow:hidden}
.who b{display:block;margin-top:16px;font-family:'Gowun Batang',serif;font-size:18px}
.who.a{--c:var(--a);--c30:var(--a30);--c60:var(--a60)}.mb{display:block;font-style:normal;font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--c);margin-top:2px}.who.b{--c:var(--b);--c30:var(--b30);--c60:var(--b60)}
.call{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:999px;font-size:12px;background:var(--c30);border:1px solid var(--c)}
.thread{width:100%;height:60px;overflow:visible}
.thread path{fill:none;stroke:url(#g);stroke-width:3;stroke-linecap:round;stroke-dasharray:6 8;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}.thread .p2{stroke-width:1.5;opacity:.5;animation-direction:reverse}
.meet{margin:30px 0 26px;text-align:center;font-size:15px;color:#eee9fb;padding:14px 18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px}
.meet small{display:block;color:#9f97b8;font-size:12px;margin-bottom:2px}
.gauges{display:grid;gap:14px}
.g{display:grid;grid-template-columns:1fr 74px 1fr;align-items:center;gap:8px;font-size:13px}
.g .lb{text-align:center;color:#d8d2ea}
.bar{position:relative;height:20px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden}.bar i{border-radius:10px}.bar span{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:0 9px;font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55)}.bar span b{font-weight:400;opacity:.6}.bar span b.on{font-weight:700;opacity:1}
.bar i{display:block;height:100%;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar.l i{background:linear-gradient(90deg,var(--a),var(--al));box-shadow:0 0 12px var(--a)}.bar.r i{background:linear-gradient(90deg,var(--b),var(--bl));box-shadow:0 0 12px var(--b)}
.q{display:grid;gap:12px;margin-top:30px}
.q p{margin:0;padding:12px 16px;font-size:15px;white-space:pre-wrap}
.q .a{background:var(--a20);border:1px solid var(--a70);border-radius:18px 18px 18px 4px;margin-right:14%}
.q .b{background:var(--b20);border:1px solid var(--b70);border-radius:18px 18px 4px 18px;margin-left:14%;text-align:right}
dialog{border:0;border-radius:14px;padding:16px;background:var(--panel);color:var(--ink);max-width:min(92vw,640px)}
dialog img{width:100%;border-radius:10px;display:block}.cap *{animation:none!important;transition:none!important}.ph{border:3px solid var(--c);box-shadow:0 0 22px var(--c60)}.fx{position:absolute!important;top:0;left:0;width:100%;height:100%;pointer-events:none}.form select{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
dialog::backdrop{background:rgba(0,0,0,.6)}
@media(prefers-reduced-motion:reduce){.spk b{animation:none}.thread path{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<div class="app">
  <section class="form" id="form">
    <h1>관계성 페어틀 제작기</h1>
    <div id="fields"></div>
    <label>사진 A / 사진 B (원형으로 잘려요)</label>
    <div class="row"><input type="file" id="pA" accept="image/*"><input type="file" id="pB" accept="image/*"></div>
    <p class="sec">MBTI 성향 (슬라이더를 오른쪽으로 밀수록 오른쪽 글자 쪽)</p>
    <div id="gform"></div>
    <label for="fxSel">이펙트</label><select id="fxSel"><option value="none">없음</option><option value="feather">천사 깃털</option><option value="snow">눈</option><option value="rain">비</option><option value="petal" selected>꽃잎</option><option value="ash">불꽃 재</option><option value="star">별빛</option></select>
    <div class="btns"><button id="replay">움직임 다시 보기</button><button class="main" id="save">이미지로 만들기</button><button class="main" id="gif">GIF로 만들기</button></div>
  </section>
  <section class="stage">
    <div class="card" id="card">
      <div class="spk" aria-hidden="true"><b style="top:20px;left:26px">✦</b><b style="top:40px;right:34px;font-size:11px;animation-delay:.8s">✧</b><b style="bottom:26px;left:38px;font-size:11px;animation-delay:1.4s">✧</b><b style="bottom:34px;right:28px;animation-delay:.4s">✦</b></div>
      <div class="orn"><i></i><em>◆</em><i></i></div>
      <h2 id="o_title"></h2>
      <div class="dday"><small id="o_dl"></small><strong id="o_dd"></strong></div>
      <div class="pair">
        <div class="who a"><div class="ph" id="phA"></div><b id="o_nA"></b><em class="mb" id="o_mA"></em><span class="call" id="o_callA"></span></div>
        <div class="mid"><svg class="thread" viewBox="0 0 200 60" preserveAspectRatio="none"><defs><linearGradient id="g"><stop offset="0" stop-color="var(--a)"/><stop offset="1" stop-color="var(--b)"/></linearGradient></defs><path d="M0 30 C60 -10, 140 70, 200 30"/><path class="p2" d="M0 30 C60 70, 140 -10, 200 30"/></svg><span class="knot">♥</span></div>
        <div class="who b"><div class="ph" id="phB"></div><b id="o_nB"></b><em class="mb" id="o_mB"></em><span class="call" id="o_callB"></span></div>
      </div>
      <div class="meet"><small>처음 만난 순간</small><span id="o_meet"></span></div>
      <div class="gauges" id="gauges"></div>
      <div class="q"><p class="a" id="o_qA"></p><p class="b" id="o_qB"></p></div>
      <canvas class="fx" id="fx" aria-hidden="true"></canvas>
    </div>
  </section>
</div>
<dialog id="dlg"><p style="margin:0 0 10px;font-size:14px">이미지를 길게 누르거나 우클릭해서 저장하세요.</p><img id="out" alt="완성된 페어틀"><div class="btns"><button id="close">닫기</button></div></dialog>
<script>
var F=[['title','관계명','text','서로의 유일한 반대편'],['dlabel','디데이 이름','text','함께한 지'],['dt','기념일 (시작일 또는 목표일)','dt','2026-08-01T00:00'],['nA','이름 A','text','이안'],['nB','이름 B','text','세린'],['cA','색 A','color','#6fa8dc'],['cB','색 B','color','#e58aa0'],['callA','A가 부르는 호칭','text','꼬맹이'],['callB','B가 부르는 호칭','text','선배'],['meet','처음 만난 계기','textarea','비 오는 날, 같은 우산 아래에서'],['qA','A의 한마디','textarea','네가 먼저 등 돌리기 전엔 나는 안 가.'],['qB','B의 한마디','textarea','그러면 오래 붙잡고 있어요, 제 손.']];

var $=function(i){return document.getElementById(i)};
var fh='';

});

$('gform').innerHTML=gf;$('gauges').innerHTML=gv;
function val(id){return $('f_'+id).value}

  $('o_dl').textContent=val('dlabel');tick();ph('phA',val('cA'),val('nA'),imgs.A);ph('phB',val('cB'),val('nB'),imgs.B);

}
function load(inp,key){inp.addEventListener('change',function(){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var cv=document.createElement('canvas'),S=320,m=Math.min(im.width,im.height),x=cv.getContext('2d');cv.width=cv.height=S;x.fillStyle='#231f33';x.fillRect(0,0,S,S);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);imgs[key]=cv.toDataURL('image/jpeg',.9);render()};im.onerror=function(){alert('이 사진은 불러올 수 없어요. JPG나 PNG로 다시 올려 주세요.')};im.src=r.result};r.readAsDataURL(f)})}
load($('pA'),'A');load($('pB'),'B');
$('form').addEventListener('input',render);

$('replay').onclick=replay;
$('close').onclick=function(){$('dlg').close()};
$('save').onclick=function(){
  if(!window.html2canvas){alert('이미지 도구를 불러오지 못했어요. 새로고침 후 다시 시도해 주세요.');return}

var tOff=0,BY=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];

for(i=1;i<px.length;i++){var c=px[i],key=pre*256+c,v=dict.get(key);if(v!==undefined){pre=v}else{out(pre);if(next<4096){dict.set(key,next++);if(next>(1<<size)&&size<12)size++}else{out(clear);dict.clear();next=258;size=9}pre=c}}
out(pre);out(eoi);if(bits>0)blk.push(buf&255);if(blk.length){o.push(blk.length);for(k=0;k<blk.length;k++)o.push(blk[k])}o.push(0)}

o.push(71,73,70,56,57,97);w16(w);w16(h);o.push(247,0,0);
